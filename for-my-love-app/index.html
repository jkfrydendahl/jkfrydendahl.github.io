<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>For My Love</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6b81">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><text x='52%' y='60%' font-size='34' text-anchor='middle' dominant-baseline='middle'>❤️</text></svg>">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-heart-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=26.10.1.1">

  <script defer src="./content.js?v=26.10.1.1"></script>
  <script defer src="./soundtracks.js?v=26.10.1.1"></script>
  <script defer src="./app.js?v=26.10.1.1"></script>
</head>
<body>
  <main class="container">
    <button class="notif-button" id="enable-push" type="button">
      Enable Push 🔔
    </button>
    <button class="reset-button" id="reset-display" type="button">
      Get Another 💕
    </button>

    <h1 class="main-title">Dagens Citat</h1>
    <div class="nickname" id="nickname">N/A</div>
    <div class="quote" id="quote">Loading...</div>
    <div class="daily-emojis" id="emoji-of-the-day"></div>

    <section
      class="soundtrack"
      id="soundtrack"
      aria-labelledby="soundtrack-heading"
      hidden
    >
      <h2 class="soundtrack-heading" id="soundtrack-heading">
        Dagens Soundtrack
      </h2>
      <a
        class="soundtrack-link"
        id="soundtrack-link"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span
          class="soundtrack-track-title"
          id="soundtrack-track-title"
        ></span>
        <span class="soundtrack-artist" id="soundtrack-artist"></span>
      </a>
    </section>

    <div id="app-version"></div>
  </main>
</body>
</html>
