name: Validate shared love app

on:
  pull_request:
    paths:
      - 'for-my-love-app/**'
      - '.github/workflows/love-app-validate.yml'
  push:
    branches: [main]
    paths:
      - 'for-my-love-app/**'
      - '.github/workflows/love-app-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node for-my-love-app/validate.mjs
      - run: node --test for-my-love-app/tests/*.test.mjs
