<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>For My Love</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6b81">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><text x='52%' y='60%' font-size='34' text-anchor='middle' dominant-baseline='middle'>❤️</text></svg>">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-heart-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=26.11.23.2">

  <script defer src="./app.js?v=26.11.23.2"></script>
</head>
<body>
  <main class="container">
    <button class="notif-button" id="enable-push" type="button">
      Enable Push 🔔
    </button>
    <button class="reset-button" id="reset-display" type="button">
      Get Another 💕
    </button>

    <h1 class="main-title">Dagens Citat</h1>
    <div class="nickname" id="nickname">N/A</div>
    <div class="quote" id="quote">Loading...</div>
    <div class="daily-emojis" id="emoji-of-the-day"></div>

    <section
      class="soundtrack"
      id="soundtrack"
      aria-labelledby="soundtrack-heading"
      hidden
    >
      <h2 class="soundtrack-heading" id="soundtrack-heading">
        Dagens Soundtrack
      </h2>
      <a
        class="soundtrack-link"
        id="soundtrack-link"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span
          class="soundtrack-track-title"
          id="soundtrack-track-title"
        ></span>
        <span class="soundtrack-artist" id="soundtrack-artist"></span>
      </a>
    </section>

    <footer class="app-meta">
      <p class="sync-status" id="sync-status" role="status" aria-live="polite">Connecting…</p>
      <div id="app-version"></div>
    </footer>
  </main>
  <dialog id="change-code-dialog" aria-labelledby="change-code-heading">
    <form id="change-code-form">
      <h2 id="change-code-heading">Change the shared entry</h2>
      <p>Enter your change code to get another entry on every device. This device will remember it.</p>
      <label for="change-code">Change code</label>
      <input id="change-code" type="password" autocomplete="off" required maxlength="256" autofocus>
      <p id="change-code-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancel-change-code" type="button">Cancel</button>
        <button id="save-change-code" type="submit">Get Another 💕</button>
      </div>
    </form>
  </dialog>
</body>
</html>
